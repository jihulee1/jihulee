<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Five-stream semiconductor fab water model</title><desc id="desc">Assumed 30,000 cubic meters per day of water demand is split 72 percent to UPW, 18 percent to cooling and 10 percent to scrubbers. The Python model separates rinse, acid, copper, cooling and utility wastewater. Captured water goes through reuse treatment; the remainder and rejects need discharge treatment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 6 4 0 7" fill="none" stroke="#6b8e7a" stroke-width="1.5"/></marker></defs><rect width="1200" height="720" rx="28" fill="#edf4ef"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="40" y="43" font-size="13" letter-spacing="2" fill="#53705e">MY FAB MODEL · WATER QUANTITY + WATER QUALITY</text><text x="40" y="93" font-size="34" font-weight="700" fill="#1d4935">30,000 m³/day. Five streams to track.</text><text x="40" y="125" font-size="16" fill="#5b7264">Assumed daily end-use demand · steady-state design scenario</text>
<rect x="40" y="162" width="645" height="85" rx="14" fill="#e2eee7" stroke="#c9dacd"/><text x="362.5" y="194" text-anchor="middle" font-size="24" font-weight="700" fill="#244735">Process / UPW · 72%</text><text x="362.5" y="221" text-anchor="middle" font-size="15" fill="#526a5a">21,600 m³/day</text><rect x="705" y="162" width="215" height="85" rx="14" fill="#e2eaf1" stroke="#c9dacd"/><text x="812.5" y="194" text-anchor="middle" font-size="20" font-weight="700" fill="#244735">Cooling · 18%</text><text x="812.5" y="221" text-anchor="middle" font-size="15" fill="#526a5a">5,400 m³/day</text><rect x="940" y="162" width="220" height="85" rx="14" fill="#eae6f2" stroke="#c9dacd"/><text x="1050.0" y="194" text-anchor="middle" font-size="20" font-weight="700" fill="#244735">Utilities · 10%</text><text x="1050.0" y="221" text-anchor="middle" font-size="15" fill="#526a5a">3,000 m³/day</text><rect x="40" y="327" width="200" height="89" rx="14" fill="#fff" stroke="#c9dacd"/><text x="140.0" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#244735">UPW rinse</text><text x="140.0" y="386" text-anchor="middle" font-size="15" fill="#526a5a">15,120 m³/day</text><rect x="40" y="327" width="200" height="6" rx="3" fill="#398a85"/><path d="M175 247V285H140V327" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><path d="M140 416V466" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="327" width="200" height="89" rx="14" fill="#fff" stroke="#c9dacd"/><text x="370.0" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#244735">HF / acid</text><text x="370.0" y="386" text-anchor="middle" font-size="15" fill="#526a5a">3,888 m³/day</text><rect x="270" y="327" width="200" height="6" rx="3" fill="#ab824e"/><path d="M360 247V285H370V327" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><path d="M370 416V466" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="327" width="200" height="89" rx="14" fill="#fff" stroke="#c9dacd"/><text x="600.0" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#244735">Copper-bearing</text><text x="600.0" y="386" text-anchor="middle" font-size="15" fill="#526a5a">2,592 m³/day</text><rect x="500" y="327" width="200" height="6" rx="3" fill="#aa6256"/><path d="M545 247V285H600V327" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 416V466" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="327" width="200" height="89" rx="14" fill="#fff" stroke="#c9dacd"/><text x="830.0" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#244735">Cooling effluent</text><text x="830.0" y="386" text-anchor="middle" font-size="15" fill="#526a5a">5,319 m³/day*</text><rect x="730" y="327" width="200" height="6" rx="3" fill="#5686b0"/><path d="M812 247V285H830V327" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 416V466" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="960" y="327" width="200" height="89" rx="14" fill="#fff" stroke="#c9dacd"/><text x="1060.0" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#244735">Scrubbers</text><text x="1060.0" y="386" text-anchor="middle" font-size="15" fill="#526a5a">3,000 m³/day</text><rect x="960" y="327" width="200" height="6" rx="3" fill="#7b76a6"/><path d="M1050 247V285H1060V327" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><path d="M1060 416V466" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="466" width="1120" height="81" rx="14" fill="#f7faf6" stroke="#c9dacd"/><text x="600.0" y="498" text-anchor="middle" font-size="22" font-weight="700" fill="#244735">Capture each stream separately</text><text x="600.0" y="525" text-anchor="middle" font-size="15" fill="#526a5a">Baseline capture fractions: 85% rinse · 10% HF/acid · 10% copper · 30% cooling · 20% utilities</text><path d="M340 547V576" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><path d="M882 547V576" fill="none" stroke="#6b8e7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="576" width="570" height="88" rx="14" fill="#dfeee6" stroke="#c9dacd"/><text x="325.0" y="608" text-anchor="middle" font-size="20" font-weight="700" fill="#244735">Reuse treatment → recovered water</text><text x="325.0" y="635" text-anchor="middle" font-size="15" fill="#526a5a">Rinse train: dual-pass RO in WAVE; final UPW polish downstream</text><rect x="640" y="576" width="520" height="88" rx="14" fill="#f0e9de" stroke="#c9dacd"/><text x="900.0" y="608" text-anchor="middle" font-size="20" font-weight="700" fill="#244735">Discharge treatment</text><text x="900.0" y="635" text-anchor="middle" font-size="15" fill="#526a5a">Uncaptured water + RO rejects; contaminant checks</text><text x="40" y="699" font-size="13" fill="#526a5a">*Cooling flow follows 81 m³/day evaporation. Other treatment performance is estimated; 85% recycling remains a target.</text></g></svg>